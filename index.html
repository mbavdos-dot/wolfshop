<title>Wolf | فروشگاه عکس دیجیتال</title>
<meta name="description" content="Wolf: فروشگاه عکس دیجیتال. خرید تک‌به‌تک عکس با کیفیت بالا و بدون واترمارک. Wolf, a digital photography shop: buy high-quality photographs one at a time.">
<meta property="og:title" content="Wolf">
<meta property="og:description" content="Digital photographs, one at a time.">
<meta name="theme-color" content="#faf8f5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf8f5;--card:#ffffff;--ink:#1c1a1f;--rule:#e4e0da;--mute:#6b6670;--soft:#f0ece6;--err:#b00020;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#131114;--card:#1c1a1f;--ink:#f4f1ee;--rule:#33303a;--mute:#a9a4ae;--soft:#242129;--err:#ff8a9b}
}
:root[data-theme="dark"]{--paper:#131114;--card:#1c1a1f;--ink:#f4f1ee;--rule:#33303a;--mute:#a9a4ae;--soft:#242129;--err:#ff8a9b}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.7;font-variant-numeric:tabular-nums}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:18px}
.mute{color:var(--mute)}.small{font-size:.875rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.grow{flex:1;min-width:0}
h1,h2,h3{margin:0;line-height:1.25}
hr{border:0;border-top:1px solid var(--rule);margin:8px 0}

/* header */
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);box-shadow:0 1px 8px rgba(0,0,0,.08)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:10px}
.icon{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:0;background:none;cursor:pointer;color:var(--ink)}
.icon:hover{background:var(--soft)}
.mark{background:none;border:0;padding:0 4px;cursor:pointer;color:var(--ink);font-family:'Instrument Serif',Georgia,serif;font-size:2.1rem;line-height:1;letter-spacing:-.01em}
.b-menu{order:1}.mark{order:2}.bar .grow{order:3}.b-lang{order:4}.b-user{order:5}
.search{order:6;flex:1 1 100%;display:flex;align-items:center;border:2px solid var(--ink);border-radius:999px;background:var(--card);padding:2px 4px 2px 16px;padding-inline:16px 4px}
.search input{flex:1;min-width:0;border:0;background:none;padding:8px 0;outline:none;width:100%}
.sbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center;cursor:pointer;flex:none}
@media(min-width:760px){
  .search{order:3;flex:1 1 auto;max-width:620px;margin-inline:16px}
  .bar .grow{display:none}
  .b-lang{margin-inline-start:auto}
}

/* buttons + fields */
.btn{display:inline-block;background:var(--ink);color:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:11px 26px;font-weight:700;cursor:pointer;text-align:center}
.btn:hover:not(:disabled){opacity:.86}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.alt:hover:not(:disabled){background:var(--soft);opacity:1}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:6px 16px;font-size:.875rem}
.btn.block{display:block;width:100%;padding:14px 26px;font-size:1.05rem}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:5px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
label{display:block;font-weight:500;margin-top:14px;margin-bottom:4px}
input:not([type="radio"]):not([type="search"]),select,textarea{width:100%;border:1px solid #8e8a93;border-radius:14px;background:var(--card);padding:10px 14px}
textarea{min-height:76px;resize:vertical}
fieldset{border:0;padding:0;margin:14px 0 0}
legend{font-weight:700;padding:0;margin-bottom:6px}
.err{color:var(--err);font-weight:500;margin:10px 0 0}

/* shop page */
.crumb{color:var(--mute);font-size:.9rem;padding-top:18px}
.crumb .link{color:var(--mute);text-decoration:none}
.crumb .link:hover{text-decoration:underline}
.shophead{padding-bottom:8px}
.h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(2.2rem,6vw,3.4rem);margin-top:6px}
html[lang="fa"] .h1{font-family:'Vazirmatn',Tahoma,sans-serif;font-weight:700;font-size:clamp(1.8rem,5vw,2.6rem)}
.lead{max-width:56ch;margin:8px 0 0}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 14px;margin-top:22px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:none;border:0;padding:0;cursor:pointer;text-align:start}
.tile .ph{aspect-ratio:3/2;border-radius:16px}
.tile .tl{font-weight:700;margin-top:8px}
.tile[aria-pressed="true"] .ph{outline:3px solid var(--ink);outline-offset:2px}
.resline{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;margin:28px 0 14px;color:var(--mute);font-size:.95rem}
#gallery{padding-bottom:64px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:26px 18px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:none;border:0;padding:0;text-align:start;cursor:pointer;display:block;width:100%}
.card .ph{aspect-ratio:1/1;border-radius:16px}
.card:hover .ph img{opacity:.92}
.card .ct{margin-top:8px;font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cp{font-weight:700;margin-top:2px}
.card .cc{color:var(--mute);font-size:.8rem}
.empty{padding:50px 0;color:var(--mute)}
.ph{background:var(--soft);overflow:hidden;position:relative}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph.sm{width:84px;flex:none;aspect-ratio:1;border-radius:12px}
.ph.xs{width:64px;flex:none;aspect-ratio:1;border-radius:10px}
h2.sec{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:2rem;padding-bottom:8px}
html[lang="fa"] h2.sec{font-family:'Vazirmatn',Tahoma,sans-serif;font-weight:700;font-size:1.5rem}

/* product page */
.pp{padding-bottom:48px}
.ppgrid{display:grid;gap:20px;margin-top:12px}
@media(min-width:900px){.ppgrid{grid-template-columns:1.35fr 1fr;gap:44px;align-items:start}.ppinfo{position:sticky;top:130px}}
.ppimg{background:var(--soft);border-radius:0;margin-inline:-18px;display:grid;place-items:center}
.ppimg img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain}
@media(min-width:900px){.ppimg{margin-inline:0;border-radius:20px;overflow:hidden}}
.price{font-size:1.8rem;font-weight:700}
.price2{font-size:.95rem}
.ptitle{font-size:1.25rem;font-weight:500;margin-top:8px;line-height:1.5}
.buyrow{margin-top:16px}
.buybar{position:sticky;bottom:0;background:var(--paper);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-top:16px;border-top:1px solid var(--rule)}
@media(min-width:900px){.buybar{display:none}}
@media(max-width:899px){.buyrow{display:none}}
details{border-top:1px solid var(--rule);padding:0}
details:last-of-type{border-bottom:1px solid var(--rule)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:16px 2px;font-weight:700}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg);margin-inline-end:6px;transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg)}
details .dt{padding:0 2px 18px}
details ul{margin:8px 0 0;padding-inline-start:20px}
.shopcard{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:16px;margin-top:22px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:'Instrument Serif',Georgia,serif;font-size:1.6rem;flex:none}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.hscroll .card{flex:0 0 44%;max-width:230px;scroll-snap-align:start}

/* dialogs */
dialog{border:0;background:var(--card);color:var(--ink);padding:0;width:min(600px,94vw);max-height:92vh;overflow:auto;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog.sheet{margin:0;margin-inline-end:auto;height:100dvh;max-height:100dvh;width:min(360px,88vw);border-radius:0}
dialog.pop{margin:0;margin-inline-start:auto;margin-top:calc(env(safe-area-inset-top,0px) + 58px);margin-inline-end:8px;width:min(340px,94vw)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;position:sticky;top:0;background:var(--card);z-index:2}
.dhead h2{font-size:1.2rem}
.x{background:none;border:0;font-size:2rem;line-height:1;cursor:pointer;padding:0 6px}
.dbody{padding:0 22px 26px}
.menu{padding:0 10px 20px;display:flex;flex-direction:column}
.mi{background:none;border:0;text-align:start;padding:14px 12px;border-radius:12px;cursor:pointer;font-weight:500}
.mi:hover{background:var(--soft)}
.who{display:flex;gap:12px;align-items:center;padding:6px 12px 14px;border-bottom:1px solid var(--rule);margin-bottom:6px;overflow-wrap:anywhere}
.ckitem{display:flex;gap:14px;align-items:center;padding:6px 0 14px;border-bottom:1px solid var(--rule)}
.ckitem .t{font-weight:700}
.demo{background:var(--soft);border-radius:12px;padding:10px 14px;margin:14px 0 0;font-size:.875rem}
.opt{display:flex;gap:12px;align-items:center;border:1px solid var(--rule);border-radius:16px;padding:12px 14px;margin:8px 0 0;cursor:pointer;font-weight:400}
.opt:has(input:checked){outline:2px solid var(--ink);outline-offset:-2px}
.opt input{accent-color:var(--ink);width:18px;height:18px;flex:none}
.opt small{display:block;color:var(--mute)}
.opt .amt{margin-inline-start:auto;font-weight:700;white-space:nowrap}
.addr{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.addr code{flex:1;min-width:0;border-radius:12px;padding:9px 12px;overflow-wrap:anywhere;user-select:all;background:var(--soft)}
.tabs{display:flex;gap:8px;margin-top:6px}

/* orders + admin */
.page{padding-block:34px 72px}
.mat{display:block;width:100%;text-align:start;background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:18px;padding:16px}
.order{display:flex;gap:16px;align-items:flex-start;margin-top:16px}
.order h3{font-size:1.05rem}
.meta{display:flex;flex-wrap:wrap;gap:0 18px;color:var(--mute);font-size:.875rem;margin:4px 0 8px}
.alist{list-style:none;margin:10px 0 0;padding:0}
.arow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding:12px 0}
.arow.hid{opacity:.55}
.scroller{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--rule);font-size:.875rem}
th{border-bottom-color:var(--ink)}
.two{display:grid;gap:0 16px}
@media(min-width:640px){.two{grid-template-columns:1fr 1fr}}
footer{border-top:1px solid var(--rule);padding-block:24px;color:var(--mute);font-size:.875rem;background:var(--soft)}

/* toast */
#toast{position:fixed;inset:auto;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);margin:0;border:0;border-radius:999px;background:var(--ink);color:var(--paper);padding:10px 22px;max-width:90vw}
</style>

const previewUrl = p => sb.storage.from('previews').getPublicUrl(p.preview_path).data.publicUrl;

/* ---------- data ---------- */
async function callFn(name, body) {
  const { data, error } = await sb.functions.invoke(name, { body });
  if (!error) return { data };
  let detail = {}; try { detail = await error.context.json() } catch (e) {}
  return { error: detail.error || 'generic' };
}
async function loadPhotos() {
  const { data } = await sb.from('photos').select('*').order('created_at', { ascending: false });
  photos = data || [];
}
async function loadSettings() {
  const { data } = await sb.from('settings').select('*').eq('id', 1).maybeSingle();
  if (data) settings = data;
}
async function refreshUser() {
  const { data } = await sb.auth.getSession();
  session = data.session || null; isAdmin = false;
  if (session) {
    const { data: a } = await sb.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
    isAdmin = !!a;
  }
}
async function runLookup() {
  lookupOrders = [];
  if (!lookup) return;
  const r = await callFn('order-access', { action: 'lookup', order_id: lookup.code, email: lookup.email });
  if (r.data && r.data.order) lookupOrders = [r.data.order];
}
async function loadViewData() {
  if (view === 'orders') {
    if (session) { const { data } = await sb.from('orders').select('*').order('created_at', { ascending: false }); myOrders = data || [] }
    else await runLookup();
  }
  if (view === 'admin' && isAdmin) {
    const { data } = await sb.from('orders').select('*').order('created_at', { ascending: false }); adminOrders = data || [];
  }
}

const errText = code => T[lang]['err_' + code] || t('err_generic');

async function startPayment() {
  const radio = document.querySelector('input[name=m]:checked');
  const isCrypto = radio && radio.value === 'crypto';
  ck.method = isCrypto ? 'crypto' : 'zarinpal'; ck.coin = $('#coin').value; ck.err = ''; ck.busy = true; renderCk();
  const r = await callFn('create-order', { photo_id: ck.pid, email: ck.email, method: isCrypto ? ck.coin : 'zarinpal' });
  ck.busy = false;
  if (r.error) { ck.err = errText(r.error); renderCk(); return }
  store.set('last', { id: r.data.order_id, email: ck.email.toLowerCase() });
  if (!isCrypto) { window.location.href = r.data.payment_url; return }
  ck.order = r.data; ck.step = 'crypto'; renderCk();
}
async function checkCrypto(orderId, fromDialog) {
  if (fromDialog) { ck.busy = true; ck.msg = ''; renderCk() }
  const r = await callFn('check-crypto', { order_id: orderId });
  if (r.data && r.data.status === 'paid') {
    if (fromDialog && ck) {
      const l = await callFn('order-access', { action: 'lookup', order_id: orderId, email: ck.email });
      if (l.data && l.data.order) { ck.order = l.data.order; ck.step = 'ok'; ck.busy = false; renderCk() }
    }
    toast(t('pay_ok'));
  } else {
    if (fromDialog && ck) { ck.busy = false; ck.msg = t('cr_still'); renderCk() } else toast(t('cr_still'));
  }
  if (view === 'orders') { await loadViewData(); render() }
}
async function download(orderId, email) {
  const r = await callFn('order-access', { action: 'download', order_id: orderId, email });
  if (r.error || !r.data || !r.data.url) { toast(t('dl_none')); return }
  const a = document.createElement('a'); a.href = r.data.url; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  toast(t('dl_done'));
  if (ck && ck.step === 'ok' && ck.order) { ck.order.downloads_left = r.data.downloads_left; renderCk() }
  if (view === 'orders') { await loadViewData(); render() }
}

function renderAuth() {
  openDlg(`${dhead(authMode === 'login' ? t('au_login') : t('au_reg'))}<div class="dbody" data-form>
  <div class="tabs"><button class="chip" data-act="auth-mode" data-id="login" aria-pressed="${authMode === 'login'}">${t('au_login')}</button><button class="chip" data-act="auth-mode" data-id="reg" aria-pressed="${authMode === 'reg'}">${t('au_reg')}</button></div>
  <label for="au-e">${t('au_email')}</label><input id="au-e" type="email" autocomplete="email" inputmode="email">

  ${authErr ? `<p class="err" role="alert">${authErr}</p>` : ''}${authInfo ? `<p role="status">${authInfo}</p>` : ''}
  <div class="row"><button class="btn" data-primary data-act="auth-go">${authMode === 'login' ? t('au_go_login') : t('au_go_reg')}</button></div></div>`);

async function authGo() {
  const email = $('#au-e').value.trim().toLowerCase(), pw = $('#au-p').value;
  authErr = ''; authInfo = '';
  if (!/^\S+@\S+\.\S+$/.test(email)) authErr = t('au_bad_email');
  else if (pw.length < 6) authErr = t('au_short');
  else if (authMode === 'reg') {
    const { data, error } = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) authErr = error.message;
    else if (!data.session) authInfo = t('au_confirm');
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) authErr = t('au_bad');
  }
  if (authErr || authInfo) { renderAuth(); $('#au-e').value = email; return }
  await refreshUser(); await loadPhotos();
  if (ck) { ck.email = session.user.email; ck.step = 'method'; renderCk() }
  else { dlg.close(); if (isAdmin) { acts.go('admin'); return } }
  await loadViewData(); render();
}

  openDlg(`${dhead(p ? t('ad_edit') : t('ad_add'))}<div class="dbody" data-form>

  <div class="two"><div><label for="f-pt">${t('ad_ptoman')}</label><input id="f-pt" type="number" min="1" step="1000" inputmode="numeric" value="${p ? p.price_toman : ''}"></div><div><label for="f-pu">${t('ad_pusd')}</label><input id="f-pu" type="number" min="0.5" step="0.5" inputmode="decimal" value="${p ? p.price_usd : ''}"></div></div>
  <p class="err" id="f-err" role="alert"></p>

}
async function makePreview(file, max = 1400) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
    x.save(); x.translate(w / 2, h / 2); x.rotate(-Math.PI / 6);
    x.font = `700 ${Math.max(16, w / 24)}px sans-serif`; x.textAlign = 'center'; x.fillStyle = 'rgba(255,255,255,.36)'; x.strokeStyle = 'rgba(0,0,0,.22)'; x.lineWidth = 1;
    const step = Math.max(80, w / 6);
    for (let yy = -h; yy <= h; yy += step * .75) for (let xx = -w; xx <= w; xx += step * 1.7) { x.strokeText('WOLF', xx, yy); x.fillText('WOLF', xx, yy) }
    x.restore();
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', .8));
  } finally { URL.revokeObjectURL(url) }
}
async function savePhoto(id) {
  const g = i => $('#' + i).value.trim(), bad = m => { $('#f-err').textContent = m }, file = $('#f-file').files[0], isNew = id === 'new';
  const btn = dlg.querySelector('[data-act="save-photo"]');
  if (isNew && !file) return bad(t('ad_need_file'));
  const pt_ = +g('f-pt'), pu = +g('f-pu');
  if (!(g('f-tfa') || g('f-ten')) || !(pt_ > 0) || !(pu > 0)) return bad(t('ad_need_title'));
  bad(''); btn.disabled = true; btn.textContent = t('ad_busy');
  try {
    const p = isNew ? null : photos.find(x => x.id === id);
    const photoId = isNew ? crypto.randomUUID() : p.id;
    const tfa = g('f-tfa') || g('f-ten'), ten = g('f-ten') || g('f-tfa'), dfa = g('f-dfa') || g('f-den'), den = g('f-den') || g('f-dfa');
    const fields = { title_fa: tfa, title_en: ten, desc_fa: dfa, desc_en: den, category: g('f-cat'), price_toman: Math.round(pt_), price_usd: +pu.toFixed(2) };
    let version = isNew ? 1 : p.current_version, previewPath = p ? p.preview_path : null, origPath = null;
    if (file) {
      version = isNew ? 1 : p.current_version + 1;
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
      origPath = `${photoId}/v${version}.${ext}`; previewPath = `${photoId}/v${version}.jpg`;
      const prev = await makePreview(file);
      const u1 = await sb.storage.from('originals').upload(origPath, file, { contentType: file.type || 'image/jpeg', upsert: false });
      if (u1.error) throw u1.error;
      const u2 = await sb.storage.from('previews').upload(previewPath, prev, { contentType: 'image/jpeg', upsert: false });
      if (u2.error) throw u2.error;
    }
    if (isNew) {
      const a = await sb.from('photos').insert({ id: photoId, ...fields, current_version: 1, preview_path: previewPath }); if (a.error) throw a.error;
      const b = await sb.from('photo_versions').insert({ photo_id: photoId, version: 1, original_path: origPath }); if (b.error) throw b.error;
    } else {
      if (file) { const b = await sb.from('photo_versions').insert({ photo_id: photoId, version, original_path: origPath }); if (b.error) throw b.error }
      const a = await sb.from('photos').update({ ...fields, current_version: version, preview_path: previewPath }).eq('id', photoId); if (a.error) throw a.error;
    }
    await loadPhotos(); dlg.close(); render(); toast(t('ad_saved'));
  } catch (e) {
    bad(t('ad_fail') + (e && e.message ? ' (' + e.message + ')' : '')); btn.disabled = false; btn.textContent = t('ad_save');
  }
}

/* ---------- actions ---------- */
const acts = {
  go(id) { if (dlg.open) dlg.close(); const h = id === 'shop' ? '#/' : '#/' + id; if ((location.hash || '#/') === h) route(); else location.hash = h },
  lang() { lang = lang === 'fa' ? 'en' : 'fa'; store.set('lang', lang); if (dlg.open) dlg.close(); render() },
  scroll() { $('#gallery').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }) },
  cat(id) { cat = (cat === id && id !== 'all') ? 'all' : id; render(); const g = $('#gallery'); if (g) g.scrollIntoView({ block: 'start' }) },
  'cat-go'(id) { if (dlg.open) dlg.close(); cat = id; q = ''; acts.go('shop') },
  open(id) { location.hash = '#/p/' + id },
  search() { q = $('#q').value.trim(); cat = 'all'; afterRender = () => { const g = $('#gallery'); if (g) g.scrollIntoView({ block: 'start' }) }; acts.go('shop') },
  'clear-search'() { q = ''; cat = 'all'; render() },
  menu() {
    const list = photos.filter(p => !p.hidden), cats = CATS.filter(c => list.some(p => p.category === c));
    openDlg(`${dhead('Wolf')}<nav class="menu"><button class="mi" data-act="cat-go" data-id="all">${t('all')}</button>${cats.map(c => `<button class="mi" data-act="cat-go" data-id="${c}">${catName(c)}</button>`).join('')}<hr><button class="mi" data-act="go" data-id="orders">${t('nav_orders')}</button>${isAdmin ? `<button class="mi" data-act="go" data-id="admin">${t('nav_admin')}</button>` : ''}</nav>`, 'sheet');
  },
  account() {
    if (!session) { acts.auth(); return }
    openDlg(`${dhead(t('account'))}<div class="menu"><div class="who"><span class="avatar" aria-hidden="true">${esc(session.user.email[0].toUpperCase())}</span><bdi>${esc(session.user.email)}</bdi></div><button class="mi" data-act="go" data-id="orders">${t('nav_orders')}</button>${isAdmin ? `<button class="mi" data-act="go" data-id="admin">${t('nav_admin')}</button>` : ''}<button class="mi" data-act="signout">${t('signout')}</button></div>`, 'pop');
  },
  close() { dlg.close() },
  buy(id) { openCheckout(id) },
  'ck-email'() {
    const e = $('#ck-email').value.trim().toLowerCase(); ck.email = e;
    if (!/^\S+@\S+\.\S+$/.test(e)) { ck.err = t('err_bad_email'); renderCk(); $('#ck-email').focus(); return }
    ck.err = ''; ck.step = 'method'; renderCk();
  },
  'ck-method'() { startPayment() },
  'ck-back'() { ck.step = 'email'; ck.err = ''; renderCk() },
  'ck-check'() { checkCrypto(ck.order.order_id, true) },
  async 'cr-copy'() { const a = ck.order.address; try { await navigator.clipboard.writeText(a); toast(t('cr_copied')) } catch (e) { const c = dlg.querySelector('code'); if (c) { const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r) } } },
  dl(id, b) { download(id, b.dataset.email) },
  'check-order'(id) { checkCrypto(id, false) },
  auth() { authMode = 'login'; authErr = ''; authInfo = ''; renderAuth() },
  'auth-mode'(id) { authMode = id; authErr = ''; authInfo = ''; renderAuth() },
  'auth-go'() { authGo() },
  async signout() { if (dlg.open) dlg.close(); await sb.auth.signOut(); session = null; isAdmin = false; myOrders = []; adminOrders = []; await loadPhotos(); if (view === 'admin') { acts.go('shop') } else { await loadViewData(); render() } },
  async lookup() { lookup = { email: $('#lk-e').value.trim().toLowerCase(), code: $('#lk-c').value.trim().toUpperCase() }; await runLookup(); render() },
  edit(id) { openEdit(id) },
  'save-photo'(id) { savePhoto(id) },
  async hide(id) { await sb.from('photos').update({ hidden: true }).eq('id', id); await loadPhotos(); render() },
  async restore(id) { await sb.from('photos').update({ hidden: false }).eq('id', id); await loadPhotos(); render() },
  async 'save-settings'() {
    const patch = { usdt_address: $('#s-usdt').value.trim(), btc_address: $('#s-btc').value.trim(), download_hours: Math.max(1, +$('#s-hours').value || 72), download_limit: Math.max(1, +$('#s-limit').value || 3) };
    const { error } = await sb.from('settings').update(patch).eq('id', 1);
    if (error) return toast(t('ad_fail'));
    settings = { ...settings, ...patch }; toast(t('ad_saved'));
  },
  async 'admin-confirm'(id) {
    const now = Date.now();
    const { error } = await sb.from('orders').update({ status: 'paid', paid_at: new Date(now).toISOString(), expires_at: new Date(now + settings.download_hours * 3600e3).toISOString(), downloads_left: settings.download_limit }).eq('id', id).eq('status', 'pending');
    if (error) return toast(t('ad_fail'));
    await loadViewData(); render(); toast(t('ad_saved'));
  }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const f = acts[b.dataset.act]; if (f) f(b.dataset.id, b, e) });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('input:not([type=file])')) return;
  const box = e.target.closest('[data-form]'); const b = box && box.querySelector('[data-primary]'); if (b) { e.preventDefault(); b.click() }

dlg.addEventListener('close', () => { ck = null; dlg.className = '' });

/* ---------- routing + boot ---------- */
function parseRoute() {
  const [a, b] = location.hash.replace(/^#\/?/, '').split('/');
  if (a === 'p' && b) return { view: 'photo', id: b };
  if (a === 'orders') return { view: 'orders' };
  if (a === 'admin') return { view: 'admin' };
  return { view: 'shop' };
}
async function route() {
  const r = parseRoute(); view = r.view; curId = r.id || null;
  window.scrollTo(0, 0);
  await loadViewData(); render();
}
(async function boot() {
  if (!configured) { render(); return }
  render();
  await Promise.all([loadPhotos(), loadSettings(), refreshUser()]);
  loading = false;
  const qs = new URLSearchParams(location.search);
  if (qs.get('pay')) {
    const st = qs.get('pay'), code = qs.get('order'), last = store.get('last', null);
    if (last && code && last.id === code) lookup = { email: last.email, code };
    afterRender = () => toast(st === 'ok' ? t('pay_ok') : st === 'failed' ? t('pay_failed') : t('pay_invalid'));
    history.replaceState(null, '', location.pathname + '#/orders');
  } else if (isAdmin && !location.hash) history.replaceState(null, '', location.pathname + '#/admin');
  window.addEventListener('hashchange', route);
  await route();
})();
